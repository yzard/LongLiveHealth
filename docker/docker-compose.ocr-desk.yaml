# Image-only GPU worker for the NAS API. The inference engine stays on loopback
# inside this container; only the authenticated OCR HTTP service is published.
services:
  backend_ocr:
    image: longlivehealth-backend-ocr:local
    pull_policy: never
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      UMASK: "077"
      TZ: America/New_York
    volumes:
      - ../playground/backend_ocr:/data:ro
    ports:
      - "192.168.1.20:8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    stop_grace_period: 30s
