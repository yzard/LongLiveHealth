services:
  backend_api:
    image: longlivehealth-backend-api:local
    build:
      context: ..
      dockerfile: docker/backend_api.Dockerfile
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      RESET_ADMIN_PASSWORD: "${RESET_ADMIN_PASSWORD:-false}"
      UMASK: "077"
      TZ: "${TZ:-UTC}"
    volumes:
      - ${LONGLIVEHEALTH_API_DATA_DIR:-../playground/backend_api}:/data
    expose: ["8080"]
    networks: [ingress, inference]
    stop_grace_period: 30s
  backend_ocr:
    image: longlivehealth-backend-ocr:local
    build:
      context: ..
      dockerfile: docker/backend_ocr.Dockerfile
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      UMASK: "077"
      TZ: "${TZ:-UTC}"
    volumes:
      - ${LONGLIVEHEALTH_OCR_DATA_DIR:-../playground/backend_ocr}:/data:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LONGLIVEHEALTH_GPU_DEVICE:-0}"]
              capabilities: [gpu]
    expose: ["8000"]
    networks: [inference]
    stop_grace_period: 30s
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      LONGLIVEHEALTH_DOMAIN: "${LONGLIVEHEALTH_DOMAIN:-localhost}"
    ports:
      - "${LONGLIVEHEALTH_BIND_ADDRESS:-0.0.0.0}:${LONGLIVEHEALTH_HTTP_PORT:-80}:80"
      - "${LONGLIVEHEALTH_BIND_ADDRESS:-0.0.0.0}:${LONGLIVEHEALTH_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [ingress]
    depends_on: [backend_api]
networks:
  ingress:
  inference:
    internal: true
volumes:
  caddy-data:
  caddy-config:
