analysis_enabled = true

[server]
listen = "127.0.0.1:8080"

[security]
session_ttl_seconds = 86400
login_window_seconds = 300
login_attempts_per_window = 10
maximum_password_checks = 2

[storage]
maximum_upload_bytes = 20971520
maximum_pdf_pages = 100
maximum_image_pixels = 40000000

[jobs]
lease_seconds = 120
maximum_attempts = 3

[extraction]
output_tokens = 8192
image_pixel_budget = 2097152

# One shared inference service for document extraction and Analytics.
[llm]
base_url = "http://192.168.1.20:8080/v1"
model = "qwen3.8-flash-next-iq3_s"
adapter = "openai_chat"
api_key = "" # Set the local_llm credential in this service's operator config.toml.
timeout_seconds = 900

[llm.extra_body]
max_tokens = 4096
temperature = 0
chat_template_kwargs = { enable_thinking = false }
